# (typically under flake.actions-nix.workflows.".github/workflows/helm-publish.yaml") and run:
#   nix run .#render-workflows
# Or commit to trigger the pre-commit hook if enabled.
jobs:
  helm:
    runs-on: ubuntu-latest
    steps:
    - name: checkout
      uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
    - name: Login to GHCR
      uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
      with:
        password: ${{ secrets.GITHUB_TOKEN }}
        registry: ghcr.io
        username: ${{ github.repository_owner }}
    - if: github.event_name != 'pull_request'
      name: Package and push Helm Chart
      run: |-
        cd chart
        CHART_VERSION="${GITHUB_REF_NAME#"v"}" # remove the leading "v"
        sed -i "s|0.0.0-template|$CHART_VERSION|" Chart.yaml
        REPO_OWNER=`echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]'`
        # print helm version
        helm version
        # create chart package
        helm package .
        # Get packed chart file name
        PKG_NAME=`ls *.tgz`
        # push to GHCR
        helm push ${PKG_NAME} oci://ghcr.io/${REPO_OWNER}/charts
'on':
  push:
    tags:
    - v*
